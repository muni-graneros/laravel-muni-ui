<title>Panel de Patentes — muni-ui (demo funcional)</title>
<style>
    :root{
        --muni-bg:#f5f6f8;--muni-surface:#fff;--muni-surface-2:#f5f6f8;--muni-surface-3:#eceef2;
        --muni-text:#1a1d24;--muni-muted:#5a6070;--muni-hint:#8a90a0;--muni-border:#e0e3ea;--muni-border-2:#c8ccd6;
        --muni-accent:#0f766e;--muni-accent-strong:#115e59;--muni-accent-soft:#f0fdfa;--muni-on-accent:#fff;
        --muni-ok-fg:#0f7a5a;--muni-ok-bg:#e2f5ee;--muni-warn-fg:#c47a10;--muni-warn-bg:#fef3dc;
        --muni-danger-fg:#b03030;--muni-danger-bg:#fdeaea;--muni-info-fg:#1f5fb0;
        --muni-radius:10px;--muni-radius-lg:14px;--muni-radius-sm:7px;
        --muni-shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.06);--muni-shadow-md:0 4px 16px rgba(16,24,40,.1);--muni-shadow-lg:0 16px 40px rgba(16,24,40,.16);
        --muni-ring:0 0 0 3px color-mix(in srgb,var(--muni-accent) 30%,transparent);--muni-ease:cubic-bezier(.22,1,.36,1);--muni-dur:160ms;
        --muni-font-sans:'DM Sans',system-ui,sans-serif;--muni-font-mono:'DM Mono',ui-monospace,monospace;--muni-glow:none;
    }
    .dark,[data-muni-theme=dark]{
        --muni-bg:#0b0f14;--muni-surface:#111620;--muni-surface-2:#181e2a;--muni-surface-3:#1c2333;
        --muni-text:#e2e8f4;--muni-muted:#7a8ba8;--muni-hint:#4a5a74;--muni-border:#2a3347;--muni-border-2:#3a4560;
        --muni-accent:#f59e0b;--muni-accent-strong:#d97706;--muni-accent-soft:#2d1d00;--muni-on-accent:#0b0f14;
        --muni-ok-fg:#22c55e;--muni-ok-bg:#0d2d1a;--muni-warn-fg:#f59e0b;--muni-warn-bg:#2d1d00;
        --muni-danger-fg:#ef4444;--muni-danger-bg:#2d0d0d;--muni-info-fg:#3b82f6;
        --muni-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);--muni-shadow-md:0 8px 24px rgba(0,0,0,.45);--muni-shadow-lg:0 16px 40px rgba(0,0,0,.55);
        --muni-ring:0 0 0 3px color-mix(in srgb,var(--muni-accent) 35%,transparent);
        --muni-font-sans:'IBM Plex Sans',system-ui,sans-serif;--muni-font-mono:'IBM Plex Mono',ui-monospace,monospace;--muni-glow:0 0 6px currentColor;
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    [x-cloak]{display:none!important}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--muni-bg);color:var(--muni-text);font-family:var(--muni-font-sans);display:flex;min-height:100vh;transition:background .3s var(--muni-ease)}
    .mono{font-family:var(--muni-font-mono);font-variant-numeric:tabular-nums}
    a{color:inherit;text-decoration:none}

    /* SIDEBAR */
    .sb{flex-shrink:0;width:238px;background:var(--muni-surface);border-right:1px solid var(--muni-border);display:flex;flex-direction:column;gap:2px;padding:16px 12px;position:sticky;top:0;height:100vh}
    @media(max-width:820px){.sb{position:fixed;z-index:150;transform:translateX(-100%);transition:transform var(--muni-dur) var(--muni-ease);box-shadow:var(--muni-shadow-lg)}.sb.open{transform:none}}
    .sb__brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px;font-weight:800}
    .sb__mark{width:32px;height:32px;border-radius:9px;background:var(--muni-accent);color:var(--muni-on-accent);display:grid;place-items:center;font-weight:900;box-shadow:var(--muni-glow)}
    .sb__sec{font-family:var(--muni-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muni-hint);padding:14px 11px 5px}
    .nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--muni-radius-sm);font-size:13.5px;font-weight:500;color:var(--muni-muted);cursor:pointer;transition:.15s}
    .nav-i:hover{background:var(--muni-surface-2);color:var(--muni-text)}
    .nav-i.on{background:var(--muni-accent-soft);color:var(--muni-accent);font-weight:600}
    .nav-i .b{margin-left:auto;font-family:var(--muni-font-mono);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--muni-surface-3);color:var(--muni-muted)}
    .nav-i.on .b{background:var(--muni-accent);color:var(--muni-on-accent)}

    .col{flex:1;min-width:0;display:flex;flex-direction:column}
    /* TOPBAR */
    .top{position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--muni-surface) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--muni-border)}
    .burger{display:none;padding:6px;border:none;background:transparent;color:var(--muni-text);cursor:pointer}
    @media(max-width:820px){.burger{display:inline-flex}}
    .kbtn{display:inline-flex;align-items:center;gap:9px;flex:1;max-width:320px;padding:8px 12px;border:1px solid var(--muni-border);border-radius:var(--muni-radius-sm);background:var(--muni-surface-2);color:var(--muni-muted);font-family:var(--muni-font-sans);font-size:13px;cursor:pointer;transition:.15s}
    .kbtn:hover{border-color:var(--muni-border-2)}
    .kbtn kbd{margin-left:auto;font-family:var(--muni-font-mono);font-size:10.5px;padding:2px 6px;border:1px solid var(--muni-border);border-radius:4px}
    .top .sp{flex:1}
    .icnbtn{display:inline-flex;padding:8px;border:1px solid var(--muni-border);border-radius:var(--muni-radius-sm);background:var(--muni-surface);color:var(--muni-text);cursor:pointer;transition:.15s}
    .icnbtn:hover{border-color:var(--muni-accent)}
    .avatar{width:34px;height:34px;border-radius:50%;background:var(--muni-accent-soft);color:var(--muni-accent);display:grid;place-items:center;font-size:13px;font-weight:700}

    .main{flex:1;padding:24px;max-width:1280px;width:100%;margin:0 auto}
    .phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .eb{font-family:var(--muni-font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muni-accent)}
    h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
    .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:9px 15px;border-radius:var(--muni-radius-sm);border:1px solid transparent;cursor:pointer;transition:.15s}
    .btn-p{background:var(--muni-accent);color:var(--muni-on-accent)}.btn-p:hover{background:var(--muni-accent-strong)}
    .btn-g{background:var(--muni-surface);color:var(--muni-text);border-color:var(--muni-border)}.btn-g:hover{background:var(--muni-surface-2)}

    .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    @media(max-width:900px){.stat-row{grid-template-columns:1fr 1fr}}
    .stat{padding:15px 16px;background:var(--muni-surface);border:1px solid var(--muni-border);border-radius:var(--muni-radius);box-shadow:var(--muni-shadow);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
    .stat:hover{transform:translateY(-2px);box-shadow:var(--muni-shadow-md)}
    .stat .top{display:flex;justify-content:space-between;align-items:flex-start}
    .stat .n{font-family:var(--muni-font-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;letter-spacing:-.02em}
    .stat .l{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muni-muted);margin-top:4px}
    .stat .d{font-family:var(--muni-font-mono);font-size:11px;font-weight:600}
    .stat svg{width:100%;height:26px;margin-top:9px;display:block;overflow:visible}

    .grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
    @media(min-width:900px){.grid2{grid-template-columns:1.4fr 1fr}}
    .card{background:var(--muni-surface);border:1px solid var(--muni-border);border-radius:var(--muni-radius-lg);box-shadow:var(--muni-shadow);overflow:hidden}
    .card__h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--muni-border);font-size:14px;font-weight:700}
    .card__b{padding:18px}

    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .seg{display:inline-flex;padding:3px;gap:2px;background:var(--muni-surface-2);border:1px solid var(--muni-border);border-radius:var(--muni-radius-sm)}
    .seg span{padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muni-muted);border-radius:6px;cursor:pointer;transition:.15s}
    .seg span.on{background:var(--muni-surface);color:var(--muni-text);box-shadow:var(--muni-shadow)}
    .search{flex:1;min-width:180px;padding:9px 12px;font-size:13px;color:var(--muni-text);background:var(--muni-surface);border:1px solid var(--muni-border);border-radius:var(--muni-radius-sm);font-family:var(--muni-font-sans)}
    .search:focus{outline:none;border-color:var(--muni-accent);box-shadow:var(--muni-ring)}

    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muni-muted);padding:10px 14px;border-bottom:1px solid var(--muni-border);background:var(--muni-surface-2);cursor:pointer;user-select:none;white-space:nowrap}
    th:hover{color:var(--muni-text)}
    td{padding:11px 14px;border-bottom:1px solid var(--muni-border);white-space:nowrap}
    tbody tr{cursor:pointer;transition:background .15s}
    tbody tr:hover{background:var(--muni-surface-2)}
    tr.mor td:first-child{box-shadow:inset 3px 0 0 var(--muni-danger-fg);color:var(--muni-danger-fg);font-weight:600}
    .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--muni-font-mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
    .badge .dt{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:var(--muni-glow)}
    .badge.ok{color:var(--muni-ok-fg);background:var(--muni-ok-bg)}.badge.mo{color:var(--muni-danger-fg);background:var(--muni-danger-bg)}.badge.wa{color:var(--muni-warn-fg);background:var(--muni-warn-bg)}
    .arrow{font-family:var(--muni-font-mono);font-size:11px;opacity:.4}
    .arrow.on{opacity:1;color:var(--muni-accent)}

    /* donut legend */
    .donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .leg{display:flex;flex-direction:column;gap:9px}
    .leg div{display:flex;align-items:center;gap:9px;font-size:12.5px}
    .leg .sw{width:10px;height:10px;border-radius:3px;box-shadow:var(--muni-glow)}

    /* overlay (drawer/modal/palette/toast) */
    .ov{position:fixed;inset:0;z-index:200;background:rgba(10,14,20,.5);backdrop-filter:blur(2px)}
    .drawer{position:fixed;top:0;bottom:0;right:0;z-index:201;width:420px;max-width:92vw;background:var(--muni-surface);border-left:1px solid var(--muni-border);box-shadow:var(--muni-shadow-lg);display:flex;flex-direction:column}
    .drawer__h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--muni-border)}
    .drawer__b{flex:1;overflow-y:auto;padding:20px}
    .drawer__f{padding:14px 20px;border-top:1px solid var(--muni-border);background:var(--muni-surface-2);display:flex;justify-content:flex-end;gap:10px}
    .xbtn{padding:6px;border:none;background:transparent;color:var(--muni-muted);border-radius:var(--muni-radius-sm);cursor:pointer}
    .xbtn:hover{background:var(--muni-surface-3);color:var(--muni-text)}
    .kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--muni-border);font-size:13.5px}
    .kv span{color:var(--muni-muted)}.kv b{font-weight:600}

    .modal{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:20px}
    .modal__c{position:relative;width:100%;max-width:420px;background:var(--muni-surface);border:1px solid var(--muni-border);border-radius:var(--muni-radius-lg);box-shadow:var(--muni-shadow-lg);overflow:hidden}

    .palette{position:fixed;inset:0;z-index:250;display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px}
    .palette__c{position:relative;width:100%;max-width:540px;background:var(--muni-surface);border:1px solid var(--muni-border);border-radius:var(--muni-radius-lg);box-shadow:var(--muni-shadow-lg);overflow:hidden}
    .pitem{display:flex;align-items:center;gap:11px;padding:11px;border-radius:var(--muni-radius-sm);cursor:pointer}
    .pitem .pd{width:6px;height:6px;border-radius:50%;background:var(--muni-accent);box-shadow:var(--muni-glow)}

    .toasts{position:fixed;bottom:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
    .toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--muni-surface);border:1px solid var(--muni-border);border-left-width:3px;border-radius:var(--muni-radius);box-shadow:var(--muni-shadow-lg);min-width:240px}
    .toast.ok{border-left-color:var(--muni-ok-fg)}.toast.danger{border-left-color:var(--muni-danger-fg)}.toast.info{border-left-color:var(--muni-info-fg)}
    .toast .td{width:8px;height:8px;border-radius:50%;margin-top:5px}
    .toast.ok .td{background:var(--muni-ok-fg)}.toast.danger .td{background:var(--muni-danger-fg)}.toast.info .td{background:var(--muni-info-fg)}
    .toast .tt{font-size:13px;font-weight:700}.toast .tm{font-size:12px;color:var(--muni-muted)}

    .fade{transition:opacity var(--muni-dur) var(--muni-ease)}.fade-0{opacity:0}.fade-1{opacity:1}
    .slide{transition:transform .28s var(--muni-ease)}.slide-0{transform:translateX(100%)}.slide-1{transform:translateX(0)}
    .pop{transition:opacity var(--muni-dur) var(--muni-ease),transform var(--muni-dur) var(--muni-ease)}.pop-0{opacity:0;transform:scale(.96) translateY(8px)}.pop-1{opacity:1;transform:scale(1) translateY(0)}
</style>

<body x-data="panel()" x-init="init()" :class="dark && 'dark'" @keydown.window="if((e=$event).key==='k'&&(e.metaKey||e.ctrlKey)){e.preventDefault();openPal()}">

<!-- SIDEBAR -->
<aside class="sb" :class="sbOpen && 'open'">
    <div class="sb__brand"><div class="sb__mark">μ</div>Rentas · Graneros</div>
    <div class="sb__sec">Operación</div>
    <div class="nav-i on">◈ Patentes <span class="b">1.284</span></div>
    <div class="nav-i">⚑ Solicitudes <span class="b">38</span></div>
    <div class="nav-i">◷ Cobranza <span class="b">217</span></div>
    <div class="sb__sec">Jefatura</div>
    <div class="nav-i">▤ Reportes</div>
    <div class="nav-i">◱ Indicadores</div>
    <div class="sb__sec">Sistema</div>
    <div class="nav-i">⚙ Configuración</div>
    <div style="flex:1"></div>
    <div class="nav-i" @click="dark=!dark"><span x-text="dark?'☀':'☾'"></span> <span x-text="dark?'Tema claro':'Tema oscuro'"></span></div>
</aside>

<div class="col">
    <!-- TOPBAR -->
    <div class="top">
        <button class="burger" @click="sbOpen=!sbOpen">☰</button>
        <button class="kbtn" @click="openPal()"><span>◔</span>Buscar o ir a…<kbd>⌘K</kbd></button>
        <div class="sp"></div>
        <button class="icnbtn" @click="dark=!dark"><span x-text="dark?'☀':'☾'"></span></button>
        <span class="badge ok"><span class="dt"></span>En línea</span>
        <span class="avatar">FN</span>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="phead">
            <div><div class="eb">Rentas municipales</div><h1>Registro de patentes</h1></div>
            <div style="display:flex;gap:10px"><button class="btn btn-g">Exportar CSV</button><button class="btn btn-p" @click="toast('info','Generando','Preparando el archivo Excel…')">Descargar Excel</button></div>
        </div>

        <!-- STATS -->
        <div class="stat-row">
            <template x-for="s in stats" :key="s.l">
                <div class="stat">
                    <div class="top"><div><div class="n" :style="`color:${s.c}`" x-text="s.shown"></div><div class="l" x-text="s.l"></div></div><span class="d" :style="`color:${s.dc}`" x-text="s.d"></span></div>
                    <div x-html="s.spark"></div>
                </div>
            </template>
        </div>

        <!-- CHARTS -->
        <div class="grid2">
            <div class="card">
                <div class="card__h">Recaudación mensual <span class="mono" style="color:var(--muni-muted);font-weight:500;font-size:12px">2026</span></div>
                <div class="card__b">
                    <div style="display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px">
                        <template x-for="(b,i) in bars" :key="i">
                            <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%" :title="b.m+': '+b.v">
                                <span class="mono" style="font-size:11px;color:var(--muni-muted);margin-bottom:5px" x-text="b.v"></span>
                                <div style="width:100%;max-width:34px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--muni-accent),color-mix(in srgb,var(--muni-accent) 50%,transparent));transition:height .6s var(--muni-ease)" :style="`height:${b.v/maxBar*100}%`"></div>
                            </div>
                        </template>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:8px">
                        <template x-for="b in bars" :key="b.m"><span style="flex:1;text-align:center;font-size:10.5px;color:var(--muni-muted)" x-text="b.m"></span></template>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card__h">Estado del registro</div>
                <div class="card__b donut">
                    <div style="position:relative;width:140px;height:140px">
                        <svg viewBox="0 0 100 100" style="width:100%;height:100%;transform:rotate(-90deg)">
                            <circle cx="50" cy="50" r="42" fill="none" stroke="var(--muni-surface-3)" stroke-width="16"/>
                            <circle cx="50" cy="50" r="42" fill="none" stroke="var(--muni-ok-fg)" stroke-width="16" stroke-dasharray="219 45" stroke-dashoffset="0"/>
                            <circle cx="50" cy="50" r="42" fill="none" stroke="var(--muni-danger-fg)" stroke-width="16" stroke-dasharray="45 219" stroke-dashoffset="-219"/>
                        </svg>
                        <div style="position:absolute;inset:0;display:grid;place-items:center"><span class="mono" style="font-size:24px;font-weight:700">1.284</span></div>
                    </div>
                    <div class="leg">
                        <div><span class="sw" style="background:var(--muni-ok-fg)"></span><span style="color:var(--muni-muted);flex:1">Al día</span><b class="mono">1.067</b></div>
                        <div><span class="sw" style="background:var(--muni-danger-fg)"></span><span style="color:var(--muni-muted);flex:1">Morosas</span><b class="mono">217</b></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA sortable + drawer -->
        <div class="card">
            <div class="card__b">
                <div class="toolbar">
                    <div class="seg"><span :class="filter==='all'&&'on'" @click="filter='all'">Todas</span><span :class="filter==='mor'&&'on'" @click="filter='mor'">Morosas</span><span :class="filter==='ok'&&'on'" @click="filter='ok'">Al día</span></div>
                    <input class="search" x-model="q" placeholder="Buscar RUT o razón social…">
                </div>
                <div style="overflow-x:auto;border:1px solid var(--muni-border);border-radius:var(--muni-radius)">
                    <table>
                        <thead><tr>
                            <template x-for="c in cols" :key="c.k">
                                <th @click="sort(c.k)" :style="c.align==='r'&&'text-align:right'"><span style="display:inline-flex;align-items:center;gap:5px" x-text="c.t"></span> <span class="arrow" :class="sk===c.k&&'on'" x-text="sk===c.k?(sd>0?'↑':'↓'):'↕'"></span></th>
                            </template>
                        </tr></thead>
                        <tbody>
                            <template x-for="r in view" :key="r.rut">
                                <tr :class="r.st==='mor'&&'mor'" @click="openRow(r)">
                                    <td x-text="r.name"></td><td class="mono" x-text="r.rut"></td><td x-text="r.tipo"></td><td class="mono" style="text-align:right" x-text="r.cap"></td>
                                    <td><span class="badge" :class="{ok:r.st==='ok',mo:r.st==='mor',wa:r.st==='ven'}"><span class="dt"></span><span x-text="r.lab"></span></span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muni-muted)">
                    <span x-text="`${view.length} de ${rows.length} patentes`"></span>
                    <span class="mono">Página 1 de 43</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- DRAWER detalle -->
<template x-teleport="body"><div x-show="row" x-cloak>
    <div class="ov fade" x-show="row" x-transition:enter="fade" x-transition:enter-start="fade-0" x-transition:enter-end="fade-1" @click="row=null"></div>
    <div class="drawer slide" x-show="row" x-transition:enter="slide" x-transition:enter-start="slide-0" x-transition:enter-end="slide-1">
        <div class="drawer__h"><div><div style="font-size:15px;font-weight:700" x-text="row?.name"></div><div class="mono" style="font-size:12px;color:var(--muni-muted)" x-text="row?.rut"></div></div><button class="xbtn" @click="row=null">✕</button></div>
        <div class="drawer__b">
            <span class="badge" :class="{ok:row?.st==='ok',mo:row?.st==='mor',wa:row?.st==='ven'}" style="margin-bottom:16px"><span class="dt"></span><span x-text="row?.lab"></span></span>
            <div class="kv"><span>Tipo de patente</span><b x-text="row?.tipo"></b></div>
            <div class="kv"><span>Capital declarado</span><b class="mono" x-text="row?.cap"></b></div>
            <div class="kv"><span>Comuna</span><b>Graneros</b></div>
            <div class="kv"><span>1.ª cuota</span><b class="mono">Pagada · Ene 2026</b></div>
            <div class="kv" style="border:none"><span>2.ª cuota</span><b class="mono" x-text="row?.st==='mor'?'Vencida · Jul 2026':'Al día'"></b></div>
        </div>
        <div class="drawer__f"><button class="btn btn-g" @click="row=null">Cerrar</button><button class="btn btn-p" @click="confirmBaja=row;row=null">Notificar cobranza</button></div>
    </div>
</div></template>

<!-- MODAL confirmar -->
<template x-teleport="body"><div x-show="confirmBaja" x-cloak>
    <div class="ov fade" x-show="confirmBaja" x-transition:enter="fade" x-transition:enter-start="fade-0" x-transition:enter-end="fade-1" @click="confirmBaja=null"></div>
    <div class="modal"><div class="modal__c pop" x-show="confirmBaja" x-transition:enter="pop" x-transition:enter-start="pop-0" x-transition:enter-end="pop-1">
        <div style="padding:18px 20px;border-bottom:1px solid var(--muni-border);font-size:15px;font-weight:700">Notificar cobranza</div>
        <div style="padding:20px;font-size:14px;line-height:1.55;color:var(--muni-text)">Se enviará un aviso de cobranza a <b x-text="confirmBaja?.name"></b>. Queda registrado en la auditoría municipal.</div>
        <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--muni-border);background:var(--muni-surface-2)">
            <button class="btn btn-g" @click="confirmBaja=null">Cancelar</button>
            <button class="btn btn-p" @click="toast('ok','Aviso enviado', confirmBaja.name+' fue notificada.');confirmBaja=null">Confirmar</button>
        </div>
    </div></div>
</div></template>

<!-- COMMAND PALETTE -->
<template x-teleport="body"><div x-show="pal" x-cloak>
    <div class="ov fade" x-show="pal" x-transition:enter="fade" x-transition:enter-start="fade-0" x-transition:enter-end="fade-1" @click="pal=false"></div>
    <div class="palette"><div class="palette__c pop" x-show="pal" x-transition:enter="pop" x-transition:enter-start="pop-0" x-transition:enter-end="pop-1">
        <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--muni-border)">
            <span style="color:var(--muni-muted)">◔</span>
            <input x-ref="pinput" x-model="pq" @keydown.down.prevent="pmove(1)" @keydown.up.prevent="pmove(-1)" @keydown.enter.prevent="pgo()" placeholder="Buscar o ir a…" style="flex:1;border:none;outline:none;background:transparent;font-family:var(--muni-font-sans);font-size:15px;color:var(--muni-text)">
            <kbd style="font-family:var(--muni-font-mono);font-size:10.5px;padding:3px 6px;border:1px solid var(--muni-border);border-radius:5px;color:var(--muni-muted)">esc</kbd>
        </div>
        <div style="max-height:52vh;overflow-y:auto;padding:6px">
            <template x-for="(it,i) in pres" :key="it.label">
                <div class="pitem" :style="pi===i&&'background:var(--muni-surface-2)'" @mouseenter="pi=i" @click="run(it)"><span class="pd"></span><span style="flex:1;font-size:13.5px;font-weight:500" x-text="it.label"></span><span class="mono" style="font-size:11px;color:var(--muni-muted)" x-text="it.g"></span></div>
            </template>
            <template x-if="pres.length===0"><div style="padding:26px;text-align:center;color:var(--muni-muted);font-size:13px">Sin coincidencias.</div></template>
        </div>
    </div></div>
</div></template>

<!-- TOASTS -->
<div class="toasts">
    <template x-for="t in toasts" :key="t.id">
        <div class="toast pop" :class="t.tone" x-transition:enter="pop" x-transition:enter-start="pop-0" x-transition:enter-end="pop-1"><span class="td"></span><div style="flex:1"><div class="tt" x-text="t.title"></div><div class="tm" x-text="t.msg"></div></div></div>
    </template>
</div>

<script>
function panel(){
    const spark=(c,p)=>{const mn=Math.min(...p),mx=Math.max(...p),r=(mx-mn)||1,n=p.length-1;const d='M'+p.map((v,i)=>`${(i/n*100).toFixed(1)},${(24-(v-mn)/r*22).toFixed(1)}`).join(' L');return `<svg viewBox="0 0 100 26" preserveAspectRatio="none"><path d="${d} L100,26 L0,26 Z" fill="${c}" opacity=".09"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>`;};
    const rows=[
        {name:'Comercial Andes Ltda.',rut:'76.150.343-2',tipo:'Comercial',cap:'$ 12.400.000',_n:12400000,st:'ok',lab:'Al día'},
        {name:'Ferretería El Roble',rut:'78.221.905-K',tipo:'Industrial',cap:'$ 8.900.000',_n:8900000,st:'mor',lab:'Morosa'},
        {name:'Panadería Santa Rosa',rut:'77.043.112-6',tipo:'Alimentos',cap:'$ 3.150.000',_n:3150000,st:'ok',lab:'Al día'},
        {name:'Transportes Maule SpA',rut:'76.998.201-4',tipo:'Servicios',cap:'$ 21.700.000',_n:21700000,st:'mor',lab:'Morosa'},
        {name:'Óptica Visión Clara',rut:'77.512.660-1',tipo:'Comercial',cap:'$ 5.600.000',_n:5600000,st:'ven',lab:'Por vencer'},
        {name:'Vivero Los Aromos',rut:'77.882.410-9',tipo:'Agrícola',cap:'$ 4.320.000',_n:4320000,st:'ok',lab:'Al día'},
        {name:'Automotriz Rancagua',rut:'76.334.902-1',tipo:'Servicios',cap:'$ 15.050.000',_n:15050000,st:'mor',lab:'Morosa'},
        {name:'Librería El Saber',rut:'77.660.220-3',tipo:'Comercial',cap:'$ 2.100.000',_n:2100000,st:'ok',lab:'Al día'},
    ];
    return {
        dark:false, sbOpen:false, q:'', filter:'all', sk:null, sd:1, rows, row:null, confirmBaja:null,
        pal:false, pq:'', pi:0, toasts:[],
        cols:[{k:'name',t:'Razón social'},{k:'rut',t:'RUT'},{k:'tipo',t:'Tipo'},{k:'cap',t:'Capital',align:'r'},{k:'st',t:'Estado'}],
        bars:[{m:'Ene',v:82},{m:'Feb',v:74},{m:'Mar',v:91},{m:'Abr',v:68},{m:'May',v:88},{m:'Jun',v:95},{m:'Jul',v:79}],
        get maxBar(){return Math.max(...this.bars.map(b=>b.v))},
        stats:[
            {l:'En el filtro',c:'var(--muni-text)',target:1284,shown:'0',d:'▲4,2%',dc:'var(--muni-ok-fg)',series:[8,9,7,11,10,13,12,15],spark:''},
            {l:'Morosas',c:'var(--muni-danger-fg)',target:217,shown:'0',d:'▲1,8%',dc:'var(--muni-danger-fg)',series:[5,6,6,8,7,9,10,11],spark:''},
            {l:'Al día',c:'var(--muni-ok-fg)',target:1067,shown:'0',d:'▲2,1%',dc:'var(--muni-ok-fg)',series:[40,42,41,44,45,44,46,48],spark:''},
            {l:'Capital (M$)',c:'var(--muni-text)',target:214,shown:'0',d:'▲3,0%',dc:'var(--muni-ok-fg)',series:[30,32,31,35,36,38,37,40],spark:''},
        ],
        cmds:[{label:'Ir a Patentes',g:'nav'},{label:'Ir a Cobranza',g:'nav'},{label:'Ir a Reportes',g:'nav'},{label:'Descargar Excel',g:'acción'},{label:'Cambiar tema',g:'acción'},{label:'Nueva patente',g:'acción'}],
        init(){ this.stats.forEach(s=>s.spark=spark(s.c==='var(--muni-danger-fg)'?'var(--muni-danger-fg)':(s.c==='var(--muni-ok-fg)'?'var(--muni-ok-fg)':'var(--muni-accent)'),s.series)); setTimeout(()=>this.stats.forEach(s=>this.cup(s)),300); },
        cup(s){const t0=performance.now();const step=t=>{const p=Math.min((t-t0)/1000,1),e=1-Math.pow(1-p,3);s.shown=Math.round(s.target*e).toLocaleString('es-CL');if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);},
        get view(){let r=this.rows;if(this.filter!=='all')r=r.filter(x=>this.filter==='mor'?x.st==='mor':x.st==='ok');if(this.q.trim()){const t=this.q.toLowerCase();r=r.filter(x=>(x.name+x.rut).toLowerCase().includes(t));}if(this.sk){const k=this.sk,d=this.sd;r=[...r].sort((a,b)=>{let x=k==='cap'?a._n:a[k],y=k==='cap'?b._n:b[k];if(typeof x==='number')return(x-y)*d;return String(x).localeCompare(String(y),'es')*d;});}return r;},
        sort(k){if(this.sk===k)this.sd*=-1;else{this.sk=k;this.sd=1;}},
        openRow(r){this.row=r;},
        openPal(){this.pal=true;this.pq='';this.pi=0;this.$nextTick(()=>this.$refs.pinput&&this.$refs.pinput.focus());},
        get pres(){const t=this.pq.trim().toLowerCase();return t?this.cmds.filter(c=>c.label.toLowerCase().includes(t)):this.cmds;},
        pmove(d){const n=this.pres.length;if(n)this.pi=(this.pi+d+n)%n;},
        pgo(){const it=this.pres[this.pi];if(it)this.run(it);},
        run(it){this.pal=false;if(it.label==='Cambiar tema')this.dark=!this.dark;else this.toast('info',it.label,'Acción ejecutada.');},
        toast(tone,title,msg){const id=Date.now()+Math.random();this.toasts.push({id,tone,title,msg});setTimeout(()=>this.toasts=this.toasts.filter(t=>t.id!==id),4000);},
    };
}
</script>
