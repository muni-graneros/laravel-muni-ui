name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # `muni-graneros/laravel-muni-shared` es privado y entra como dependencia
      # de DESARROLLO (el panel ARCOP se prueba contra el módulo de privacidad
      # de verdad). Sin el token, `composer install` muere con un 404 que
      # despista: parece que el paquete no existe.
      - name: Credenciales del paquete privado
        env:
          COMPOSER_GH_TOKEN: ${{ secrets.COMPOSER_GH_TOKEN }}
        run: |
          if [ -n "${COMPOSER_GH_TOKEN:-}" ]; then
            composer config --global --auth github-oauth.github.com "$COMPOSER_GH_TOKEN"
          fi

      - run: composer install --no-progress --prefer-dist

      - name: Pest
        run: ./vendor/bin/pest

  catalogo:
    name: Catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Credenciales del paquete privado
        env:
          COMPOSER_GH_TOKEN: ${{ secrets.COMPOSER_GH_TOKEN }}
        run: |
          if [ -n "${COMPOSER_GH_TOKEN:-}" ]; then
            composer config --global --auth github-oauth.github.com "$COMPOSER_GH_TOKEN"
          fi

      - run: composer install --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/catalogo/package-lock.json

      - name: Herramientas del catálogo
        working-directory: demo/catalogo
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # demo/catalogo.html es la documentación que se comparte: si un componente
      # cambió y nadie lo regeneró, el catálogo muestra algo que ya no existe.
      - name: El catálogo está al día
        run: |
          php demo/catalogo/build.php demo/catalogo/node_modules/alpinejs/dist/cdn.min.js
          git diff --exit-code --stat demo/catalogo.html || {
            echo "::error file=demo/catalogo.html::El catálogo no está al día. Corre: cd demo/catalogo && npm run construir, y commitea demo/catalogo.html."
            exit 1
          }

      - name: Errores de JS, móvil y accesibilidad (axe)
        run: node demo/catalogo/verificar.mjs

      # Foco de modales, teclado de calendario y tabs, enlace x-model/wire:model, orden
      # de tablas, avisos: lo que Pest no ve porque ocurre en el navegador.
      - name: Interacciones de los componentes
        run: node demo/catalogo/interacciones.mjs

      # wire:model de punta a punta con Livewire real (workbench/): cada control lleva
      # su valor al servidor y refleja lo que el servidor devuelve.
      - name: Livewire de punta a punta
        run: |
          vendor/bin/testbench serve --port=8765 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/formulario && break; sleep 1; done
          node demo/catalogo/livewire.mjs || { cat /tmp/serve.log; exit 1; }

  livewire3:
    name: Livewire 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # personas-graneros sigue en Livewire 3 / Filament 3. El entorno de desarrollo
      # del paquete trae Livewire 4 (lo exige Filament 5), así que aquí se arma una app
      # aparte con Livewire 3 y el paquete desde este checkout, y se corre la misma
      # prueba de punta a punta. Livewire 3 trae Alpine 3.15, que se comporta distinto
      # (así se encontró el bug del día marcado en calendar).
      - name: App con Livewire 3
        working-directory: demo/livewire3
        run: |
          composer install --no-progress --prefer-dist
          cp -r ../../workbench ../../testbench.yaml .
          composer dump-autoload

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/catalogo/package-lock.json

      - name: Herramientas del catálogo
        working-directory: demo/catalogo
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Livewire 3 de punta a punta
        working-directory: demo/livewire3
        run: |
          vendor/bin/testbench serve --port=8766 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8766/formulario && break; sleep 1; done
          LIVEWIRE_URL=http://127.0.0.1:8766/formulario node ../catalogo/livewire.mjs || { cat /tmp/serve.log; exit 1; }
