# Vitrina de desarrollo del paquete (ficha `vitrina` de docs/GAP-ANALYSIS.md).
#
#   vendor/bin/testbench serve      → http://127.0.0.1:8000/vitrina
#
# Vive en workbench/ y NO en el paquete: el service provider no registra rutas ni
# lee configuración de vitrina, así que los sistemas que instalan laravel-muni-ui
# nunca la exponen. Las tarjetas se generan recorriendo
# resources/views/components/: un componente nuevo aparece el día que se crea.
providers:
  - Muni\Ui\MuniUiServiceProvider

env:
  - APP_ENV=local
  - APP_DEBUG=true

workbench:
  start: '/vitrina'
  install: false
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    views: false
